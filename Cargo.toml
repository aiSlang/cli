[workspace]
resolver = "2"
members = [
    "crates/aislang-cli",
    "crates/aislang-core",
    "crates/aislang-catalog",
    "crates/aislang-resolver",
    "crates/aislang-compose",
    "crates/aislang-runtime",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aislang/aislang"
authors = ["aiSlang contributors"]
rust-version = "1.78"

[workspace.dependencies]
# Internal crates
aislang-core     = { path = "crates/aislang-core",     version = "0.1.0-dev" }
aislang-catalog  = { path = "crates/aislang-catalog",  version = "0.1.0-dev" }
aislang-resolver = { path = "crates/aislang-resolver", version = "0.1.0-dev" }
aislang-compose  = { path = "crates/aislang-compose",  version = "0.1.0-dev" }
aislang-runtime  = { path = "crates/aislang-runtime",  version = "0.1.0-dev" }

# External
clap        = { version = "4.5", features = ["derive"] }
chumsky     = "0.10"
petgraph    = "0.6"
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
thiserror   = "1"
anyhow      = "1"
semver      = { version = "1",   features = ["serde"] }
sha2        = "0.10"
# week-6 Tue: in-CLI agent runtime
rmcp        = { version = "1.7", features = ["client", "transport-child-process"] }
tokio       = { version = "1",   features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "time", "sync"] }
# week-6 Wed: LiteLLM HTTP client + non-streaming chat loop
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# week-9 Mon: OTel-GenAI tracing — official Rust SDK + OTLP HTTP exporter
# (Decision 18). Targets the bundled Jaeger sidecar's :4318 HTTP port.
#
# Architecture choice (revised Mon late): simple span processor +
# blocking reqwest. `rt-tokio` + batched async export panicked on
# process exit (background thread outlived our tokio runtime). Our
# spans-per-command count is tiny (≤ a few dozen), so the per-span
# blocking HTTP cost is irrelevant and the lifecycle is rock-solid:
# span ends → synchronous POST to OTLP receiver → no daemon threads.
opentelemetry        = "0.32"
opentelemetry_sdk    = "0.32"
opentelemetry-otlp   = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-semantic-conventions = "0.32"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
codegen-units = 1
