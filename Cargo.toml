[workspace]
resolver = "2"
members = [
    "crates/aislang-cli",
    "crates/aislang-core",
    "crates/aislang-catalog",
    "crates/aislang-resolver",
    "crates/aislang-compose",
    "crates/aislang-k8s",       # Phase 2 Week 14 Mon — K8s emitter
    "crates/aislang-runtime",
    "crates/aislang-remote",    # v0.4 Week 25 Mon — remote control-plane HTTP/SSE client
]

[workspace.package]
version = "0.4.0-dev"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aislang/aislang"
authors = ["aiSlang contributors"]
rust-version = "1.78"

[workspace.dependencies]
# Internal crates
aislang-core     = { path = "crates/aislang-core",     version = "0.4.0-dev" }
aislang-catalog  = { path = "crates/aislang-catalog",  version = "0.4.0-dev" }
aislang-resolver = { path = "crates/aislang-resolver", version = "0.4.0-dev" }
aislang-compose  = { path = "crates/aislang-compose",  version = "0.4.0-dev" }
aislang-k8s      = { path = "crates/aislang-k8s",      version = "0.4.0-dev" }   # Phase 2 Week 14 Mon
aislang-runtime  = { path = "crates/aislang-runtime",  version = "0.4.0-dev" }
aislang-remote   = { path = "crates/aislang-remote",   version = "0.4.0-dev" }   # v0.4 Week 25 Mon — remote control-plane HTTP/SSE client

# External
clap        = { version = "4.5", features = ["derive"] }
chumsky     = "0.10"
petgraph    = "0.6"
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
# v0.3 Week 16 Mon: aislang.toml manifest parsing (Decision 44.1).
# Workspace-pinned so per-crate Cargo.toml just references it; the
# `default` feature pulls serde-derive integration in.
toml        = "0.8"
thiserror   = "1"
anyhow      = "1"
semver      = { version = "1",   features = ["serde"] }
sha2        = "0.10"
# v0.4 W23 Thu — `aislang-cloud` signup flow.  `rand` (CSPRNG) for
# unguessable email-verify tokens + signup ids; `hmac` (+ existing
# sha2) for Stripe webhook signature verification
# (`Stripe-Signature: t=<ts>,v1=<hmac>`).
rand        = "0.8"
hmac        = "0.12"
# week-6 Tue: in-CLI agent runtime (client). week-12 Mon: server side
# for `aislang mcp-serve` — needs the `server` feature for the
# ServerHandler trait + `tool_router`/`tool` macros, and
# `transport-io` for the stdio entry point. macros gives us
# `#[tool]` / `#[tool_router]` / `#[tool_handler]`. schemars is
# required by the macros for JSON-schema generation of tool
# parameter types.
# week-13 Mon: `transport-streamable-http-server` adds the
# `StreamableHttpService` tower service we plug into axum for
# `aislang mcp-serve --http :PORT`. Pulls in the in-memory
# `LocalSessionManager` (`local` feature).
rmcp        = { version = "1.7", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "schemars"] }
schemars    = "1.0"
# week-13 Mon: HTTP transport for `aislang mcp-serve --http`.
# `axum` is the tower-Service host that `StreamableHttpService`
# attaches to; matches the rmcp example pattern. `tokio-util` gives
# us the `CancellationToken` we hand into the service config so
# Ctrl-C cleanly drains active SSE streams.
axum        = "0.7"
tokio-util  = "0.7"
tokio       = { version = "1",   features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "time", "sync", "signal", "net"] }
# v0.4 W22 Thu — `aislang-cloud` SSE apply endpoint uses
# `tempfile::TempDir` for the per-request ephemeral working dir.
# Auto-cleanup on drop matches the contract that the apply pipeline
# leaves zero filesystem residue after the stream closes
# (Decision 46.2 + "tenant-scoped working dir auto-cleaned post-
# apply" DoD).
tempfile    = "3"
# v0.4 W23 Mon follow-up — `aislang cloud {serve,provision,meter-
# event,init}` subcommands load operator secrets from a `.env.cloud`
# file (mirrors the per-project `.env` pattern from v0.1, but
# scoped to control-plane / Stripe / Postgres creds the
# `aislang-cloud` crate reads directly).  `dotenvy` is the
# maintained replacement for the deprecated `dotenv` crate.
# Existing process env vars take precedence over file values.
dotenvy     = "0.15"
# week-6 Wed: LiteLLM HTTP client + non-streaming chat loop
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# week-9 Mon: OTel-GenAI tracing — official Rust SDK + OTLP HTTP exporter
# (Decision 18). Targets the bundled Jaeger sidecar's :4318 HTTP port.
#
# Architecture choice (revised Mon late): simple span processor +
# blocking reqwest. `rt-tokio` + batched async export panicked on
# process exit (background thread outlived our tokio runtime). Our
# spans-per-command count is tiny (≤ a few dozen), so the per-span
# blocking HTTP cost is irrelevant and the lifecycle is rock-solid:
# span ends → synchronous POST to OTLP receiver → no daemon threads.
opentelemetry        = "0.32"
opentelemetry_sdk    = "0.32"
opentelemetry-otlp   = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-semantic-conventions = "0.32"
# v0.3 Week 18 Tue: MiniJinja template engine — drives dynamic prompts
# (`prompt "<l>" { template = true … }`) + the runtime::templates::*
# API.  Default features only — we don't need the optional `builtins`
# / `loader` / `multi_template` extras for v0.3.
minijinja            = { version = "2", default-features = false, features = ["builtins", "serde"] }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
codegen-units = 1
