[package]
name = "aislang-runtime"
description = "In-CLI agent runtime — MCP stdio client + LiteLLM chat loop (v0.1)"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# rmcp gives us the official MCP client + child-process transport.
# Decision 5 (PLAN week 6): v0.1 spawns MCP servers as `docker run -i`
# stdio children; rmcp's TokioChildProcess is the wire integration.
rmcp         = { workspace = true }
# week-12 Mon: rmcp's `#[tool]` / `#[tool_router]` / `#[tool_handler]`
# macros need schemars at the call site for JsonSchema derives on tool
# parameter types.
schemars     = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
# week-6 Wed
reqwest      = { workspace = true }
sha2         = { workspace = true }
# week-7 Tue: cost arithmetic needs Money + Currency from core's types.
# Decision 6: budget enforcement lives in this crate, not LiteLLM config.
aislang-core     = { workspace = true }
# week-12 Tue: `aislang mcp-serve`'s pure-tier tools (lang_spec, examples,
# describe, validate, plan) wire to the resolver + catalog + compose
# emitter.  Pulled in here so the MCP server lives alongside the v0.1
# client.  Aligns with planning-doc Track A architectural decision #2
# (subcommand reuses workspace) and #3 (mcp-serve IS the agent runtime).
aislang-resolver = { workspace = true }
aislang-catalog  = { workspace = true }
aislang-compose  = { workspace = true }
# week-9 Mon: OTel-GenAI tracing (Decision 18). Official Rust SDK +
# OTLP HTTP/proto exporter; reqwest is reused for the OTLP transport
# (see workspace dep features: http-proto + reqwest-client +
# reqwest-rustls). Resource + semantic-convention attribute keys come
# from opentelemetry-semantic-conventions so the strings match the
# OTel-GenAI spec exactly (no typo'd `gen_ai.usage.input_tokens`).
opentelemetry                      = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
# v0.3 Week 18 Mon: `ThreadedSpanProcessor` drives export via
# `futures_executor::block_on` (tokio-free) on a dedicated OS thread.
# Using tokio's block_on there panics because reqwest::blocking creates
# its own internal tokio runtime — nested tokio contexts fail at drop
# time.  futures_executor sidesteps this; transitively available via
# opentelemetry_sdk + rmcp already.
futures-executor                   = "0.3"
# week-13 Mon: HTTP transport for `aislang mcp-serve --http`.
# rmcp ships `StreamableHttpService` as a tower service that we
# nest under an axum `Router`; `axum::serve` drives the TcpListener.
# `tokio-util::CancellationToken` is used by rmcp's session config
# so the server drains active sessions cleanly on shutdown.
axum                               = { workspace = true }
tokio-util                         = { workspace = true }

[dev-dependencies]
# wiremock — Rust port of WireMock; lets us spin up a fake HTTP server
# in-process for testing LiteLlmClient end-to-end without a real LiteLLM.
wiremock    = "0.6"
tokio       = { workspace = true, features = ["test-util"] }
