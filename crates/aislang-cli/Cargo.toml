[package]
name = "aislang-cli"
description = "Declarative AI infrastructure — CLI"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true

[[bin]]
name = "aislang"
path = "src/main.rs"

[dependencies]
aislang-core     = { workspace = true }
aislang-catalog  = { workspace = true }
aislang-resolver = { workspace = true }   # catalog ID validation (week 3 Wed)
aislang-compose  = { workspace = true }
aislang-runtime  = { workspace = true }   # in-CLI agent runtime (week 6 Tue/Wed)
clap             = { workspace = true }
anyhow           = { workspace = true }
serde            = { workspace = true }   # week 10 Thu: derive for docker compose ps json
serde_json       = { workspace = true }   # for -vvv JSON-IR rendering
tokio            = { workspace = true }   # runtime for the chat subcommand (week 6 Wed)
# week-9 Thu: per-case `aislang.case` span opened in the eval loop so
# each CaseResult can carry a Jaeger deep-link URL. Direct dep instead
# of routing through aislang-runtime helpers keeps the call site
# transparent — the CLI is where the case loop lives, so the span
# lifecycle belongs here.
opentelemetry    = { workspace = true }
# week-12 Fri: `aislang chat` is now a thin MCP client that spawns
# `aislang mcp-serve --stdio` as a child and proxies each user turn
# through the `aislang_chat_turn` tool. Same rmcp transport
# (`TokioChildProcess`) the integration tests use, promoted from
# dev-deps to main deps.
rmcp             = { workspace = true }
# week-13 Mon: `aislang mcp-serve --http <ADDR>` plumbing —
# CancellationToken bridges Ctrl-C to axum's graceful-shutdown
# path inside the runtime's `mcp_serve_http`.
tokio-util       = { workspace = true }

[dev-dependencies]
# week-12 Mon: `cli_mcp_serve` integration tests spawn the freshly
# built `aislang mcp-serve --stdio` binary as a stdio child and
# exercise it via rmcp's client side (TokioChildProcess transport).
# rmcp itself is now a main dep (week-12 Fri chat refactor); tokio
# stays here for the test crate's scope.
tokio = { workspace = true }
