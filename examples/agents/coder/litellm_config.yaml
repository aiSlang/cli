model_list:
- model_name: coder_brain
  litellm_params:
    model: anthropic/claude-haiku-4-5
    api_key: os.environ/ANTHROPIC_API_KEY
- model_name: coder_brain-fb-ollama-qwen2-5-coder-7b
  litellm_params:
    model: ollama/qwen2.5-coder:7b
    api_base: os.environ/OLLAMA_API_BASE
- model_name: local_bge
  litellm_params:
    model: ollama/bge-m3:latest
    api_base: os.environ/OLLAMA_API_BASE
router_settings:
  fallbacks:
  - coder_brain:
    - coder_brain-fb-ollama-qwen2-5-coder-7b
litellm_settings:
  callbacks:
  - otel
