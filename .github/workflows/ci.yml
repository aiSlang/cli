# aiSlang CI — PLAN-90-days-v0_1.md §Week 11 Mon, Decision 35.
#
# Test on the two platforms v0.1 supports (Linux + macOS, both
# x86_64+aarch64 via the github-hosted runner pools). Stable Rust
# only. Clippy runs informationally (no -D warnings) so the
# codebase's existing pedantic-lint drift doesn't gate PRs — see
# Mon's deliverable note for why we deferred -D warnings to v0.2.
#
# No fmt --check job: the codebase has a deliberate aligned style
# (e.g. `let foo: T   = ...; let bar: U = ...;`) that default
# rustfmt mass-rewrites. v0.2 may revisit with a custom
# `rustfmt.toml` or a vendored style guide.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Cache key suffix — bump when CI shape changes to invalidate.
  CACHE_VERSION: v1

jobs:
  # ──────────────────────────────────────────────────────────────
  # Primary gate: full workspace test suite on both platforms.
  # ──────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-test-${{ matrix.os }}

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # ──────────────────────────────────────────────────────────────
  # Compile-only check: catches type errors in code paths that
  # don't have tests (#[cfg(test)] paths only run in `cargo test`).
  # Cheaper than running tests; finishes ~30s typically.
  # ──────────────────────────────────────────────────────────────
  build:
    name: build all targets (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-build

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets --locked

  # ──────────────────────────────────────────────────────────────
  # Informational clippy run. NOT gated (no -D warnings) — exists
  # to surface lint drift in PR logs. Treat clippy output as a
  # discussion prompt, not a blocker. Promote to gated in v0.2
  # once the pedantic backlog is addressed.
  # ──────────────────────────────────────────────────────────────
  clippy:
    name: clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-clippy

      # `|| true` — informational only; never fails the workflow.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked || true

  # ──────────────────────────────────────────────────────────────
  # install.ps1 syntax check on a real Windows runner — Week 13
  # Mon (b), Track A.5.  This catches PowerShell parse errors
  # before they hit a release (since the Linux dev environment
  # can't run pwsh natively without an apt-install).
  #
  # We do NOT run install.ps1 end-to-end — the runner would need
  # WSL2 set up + Internet access to a real release, and that's
  # the cold-VM rehearsal's job (Decision 38).
  #
  # PSScriptAnalyzer is pre-installed on github-hosted windows
  # runners; we use it for style + safety checks in addition to
  # the bare AST parse.
  # ──────────────────────────────────────────────────────────────
  install-ps1-lint:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell AST parse
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly."

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Severity 'Error' is gated; warnings + info are
          # informational (printed but don't fail the job) — same
          # posture as the clippy job above.
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity @('Error','Warning','Information')
          $results | Format-Table -AutoSize
          $errors = $results | Where-Object Severity -eq 'Error'
          if ($errors) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s) in install.ps1"
            exit 1
          }

  # ──────────────────────────────────────────────────────────────
  # K8s smoke — Phase 2 Week 14 Fri (Track B close).
  #
  # End-to-end gate for the `target = kubernetes` path:
  #   1. Stand up a kind cluster (single-node, ephemeral).
  #   2. Build the aislang binary + a local `aislang:ci` image
  #      (the published `ghcr.io/aislang/aislang:latest` may not
  #      exist on every commit — pre-release branches especially).
  #   3. `kind load docker-image` to side-load the freshly-built
  #      image into the kind node — no registry push needed.
  #   4. Create the fake `aislang-providers` Secret so the
  #      preflight check passes (values don't need to be real keys
  #      because we don't make any actual provider calls in smoke).
  #   5. `aislang apply examples/support-agent-k8s.ais
  #      --output-dir <tmp>` → helm upgrade --install + the chart.
  #   6. Wait for every aislang-labelled Deployment to be Ready
  #      (kubectl rollout status, 5-min timeout per pod).
  #   7. `helm lint` the emitted chart (catches chart-shape
  #      regressions the unit tests don't cover).
  #   8. `aislang destroy` → helm uninstall; assert exit 0.
  #   9. kind delete cluster (cleanup runs `if: always()`).
  #
  # Why a separate job (not part of `test`): kind brings ~90s of
  # cluster-creation latency that's wasted on PRs that don't
  # touch k8s code.  This job gates pushes to main + can be
  # manually triggered.  v0.3 may add a `paths-filter` to skip
  # the job on docs-only PRs.
  #
  # Time budget revised (Week 15 Mon, after first live run): the
  # original 10-min ceiling was set from the local dev-box estimate
  # (kind ~30s + image build ~30s + apply ~30s + pod-ready ~30s
  # + cleanup ~10s ≈ 2 min).  GitHub-hosted runners are slower
  # on every axis — pulling the LiteLLM + Open WebUI base images
  # (each ~300-600 MB) into the kind node alone takes 3-5 min on
  # a cold runner.  Bumped to 20 min ceiling pending a per-step
  # timing breakdown from the live run; Week 15 Wed (k3s axis
  # addition) is the natural point to revisit + drop back down
  # if the actual wall time stays well under 20.
  # ──────────────────────────────────────────────────────────────
  k8s-smoke:
    name: k8s-smoke (kind + helm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-k8s-smoke

      # Build aislang binary first — the kind image build needs it
      # and we want compile errors to surface here, not deep inside
      # the docker build context.
      - name: Build aislang (release profile for the kind image)
        run: cargo build --release --bin aislang --locked

      # Set up kind + kubectl + helm.  kind action also installs
      # kubectl as a side-effect; we install helm separately.
      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: aislang-smoke
          # Pin kind+k8s versions for reproducibility.  kind 0.24
          # ships with K8s 1.31 by default.
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          wait: 90s        # node-Ready timeout

      - name: Install Helm 3
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      # Build a minimal Docker image around the freshly-built
      # binary — same distroless base as the release.yml image
      # job, but skips the multi-arch buildx + GHCR push (we just
      # need amd64 locally for kind to load).
      - name: Build local aislang:ci image
        run: |
          set -euo pipefail
          mkdir -p docker-ci
          cp target/release/aislang docker-ci/aislang
          cat > docker-ci/Dockerfile <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.7
          FROM gcr.io/distroless/cc-debian12 AS final
          COPY aislang /usr/local/bin/aislang
          USER nonroot:nonroot
          ENTRYPOINT ["/usr/local/bin/aislang"]
          DOCKERFILE
          docker build -t aislang:ci docker-ci/

      - name: Side-load image into kind
        run: kind load docker-image aislang:ci --name aislang-smoke

      # The preflight check (Thu) wants the Secret present.  Real
      # keys would never make it into a CI run anyway; dummy
      # values satisfy the existence + non-empty + ASCII probes.
      # The chat-turn round-trip step below short-circuits BEFORE
      # any real provider call, so dummy creds are fine.
      - name: Create fake aislang-providers Secret
        run: |
          kubectl create secret generic aislang-providers \
            --from-literal=ANTHROPIC_API_KEY=dummy-ci-key-ascii-only \
            --from-literal=OPENAI_API_KEY=dummy-ci-key-ascii-only \
            --from-literal=OLLAMA_API_BASE=http://nonexistent:11434

      - name: Apply the demo chart
        env:
          # Override the agent-runtime image to point at the
          # locally-side-loaded `aislang:ci` instead of the
          # default `ghcr.io/aislang/aislang:latest` (which may
          # not exist for the current commit).  Done via
          # `helm upgrade --install --set image.…` after the
          # chart is rendered + written; aislang apply doesn't
          # itself take `--set` flags (yet — v0.3 carry-over).
          KIND_OUTPUT_DIR: /tmp/aislang-k8s-smoke
        run: |
          set -euo pipefail
          mkdir -p "$KIND_OUTPUT_DIR"
          # First: render manifests + chart to disk via
          # `aislang plan` (apply would also do this but plan
          # gives us inspectability for failures).
          ./target/release/aislang plan examples/support-agent-k8s.ais \
            --output-dir "$KIND_OUTPUT_DIR" >/dev/null
          ls -la "$KIND_OUTPUT_DIR/manifests" "$KIND_OUTPUT_DIR/chart"
          # Helm install with image override so kind uses our
          # local aislang:ci.  `aislang apply` would run
          # `helm upgrade --install <release> chart/` without
          # the image override; we replicate that command + add
          # `--set image.{repository,tag}`.
          helm upgrade --install prod "$KIND_OUTPUT_DIR/chart" \
            --set image.repository=aislang \
            --set image.tag=ci \
            --wait --timeout 5m

      - name: Lint the emitted chart
        run: helm lint /tmp/aislang-k8s-smoke/chart

      - name: Verify aislang-labelled pods are Ready
        run: |
          kubectl get all -l aislang.generated=true -o wide
          # Each Deployment that aislang emits.  rollout status
          # is bounded by the helm --wait above; this loop just
          # gives a clearer per-Deployment failure than the
          # generic `--wait` timeout.
          for dep in litellm jaeger budget-counter agent-runtime openwebui; do
            kubectl rollout status deploy/$dep --timeout=2m
          done

      - name: Destroy the chart
        run: |
          set -euo pipefail
          # aislang destroy reads the state file written by apply,
          # but our apply path here was helm-direct (above) — so
          # we shell to helm uninstall manually to mirror what
          # aislang destroy would do.  Equivalence is pinned by
          # the cli_apply_destroy_k8s unit tests.
          helm uninstall prod
          # Sanity: every aislang-labelled resource should be gone.
          remaining=$(kubectl get all -l aislang.generated=true \
            --no-headers 2>/dev/null | wc -l)
          if [ "$remaining" -gt 0 ]; then
            echo "expected 0 aislang resources after destroy; got:"
            kubectl get all -l aislang.generated=true
            exit 1
          fi
          echo "destroy clean — no aislang resources remain."

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          echo "=== pods ==="
          kubectl get pods -A -o wide || true
          echo "=== aislang-labelled events ==="
          kubectl get events --sort-by=.lastTimestamp -A | tail -50 || true
          echo "=== describe litellm ==="
          kubectl describe pod -l aislang.component=litellm || true
          echo "=== describe agent-runtime ==="
          kubectl describe pod -l aislang.component=agent_runtime || true
