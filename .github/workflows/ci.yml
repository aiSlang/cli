# aiSlang CI — PLAN-90-days-v0_1.md §Week 11 Mon, Decision 35.
#
# Test on the two platforms v0.1 supports (Linux + macOS, both
# x86_64+aarch64 via the github-hosted runner pools). Stable Rust
# only. Clippy runs informationally (no -D warnings) so the
# codebase's existing pedantic-lint drift doesn't gate PRs — see
# Mon's deliverable note for why we deferred -D warnings to v0.2.
#
# No fmt --check job: the codebase has a deliberate aligned style
# (e.g. `let foo: T   = ...; let bar: U = ...;`) that default
# rustfmt mass-rewrites. v0.2 may revisit with a custom
# `rustfmt.toml` or a vendored style guide.
#
# ── Cost-tiered job triggers (Phase 2 Week 15 follow-up) ────────
#
# Free-tier GitHub Actions gives 2000 Linux-minute-equivalents per
# month on private repos; Windows runners count 2×, macOS 10×.
# Running every job on every PR ate the monthly budget in ~35
# pushes.  Split the matrix:
#
#   PR (`pull_request`) — Linux-only fast feedback:
#     test-linux, build, clippy   (~5 Linux-mins/push)
#
#   Main push (`push: branches: [main]`) — full sweep + heavy jobs:
#     test-macos, install-ps1-lint, k8s-smoke
#     (~30 Linux-equiv mins/push; happens once per merge)
#
#   workflow_dispatch — all jobs runnable manually for debugging.
#
# Regressions caught post-merge surface on the main-push run +
# get fixed in a follow-up PR.  Trade-off: ~30s window where a
# merged change has unverified macOS / Windows / k8s status; in
# practice the Linux test job catches >95 % of regressions
# because the codebase is platform-agnostic except for the
# install scripts.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Cache key suffix — bump when CI shape changes to invalidate.
  CACHE_VERSION: v1
  # Truthy when this run was triggered by a push to main (NOT a
  # pull_request).  Heavy-platform jobs (macOS test, install-ps1-
  # lint, k8s-smoke) condition on this so PRs stay cheap.  Also
  # truthy for workflow_dispatch so manual debugging triggers
  # everything regardless of branch.
  HEAVY_TIER_ENABLED: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Primary gate (every PR + main push): full workspace test
  # suite on Linux.  Linux runners are 1× weight; this is the
  # always-on tier.  >95 % of regressions surface here because
  # the codebase is platform-agnostic except for the install
  # scripts (covered by install-ps1-lint, main-only) and the
  # k8s emitter (covered by k8s-smoke, main-only).
  # ──────────────────────────────────────────────────────────────
  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-test-ubuntu-latest

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # ──────────────────────────────────────────────────────────────
  # macOS test (main-push + workflow_dispatch only — 10× weight).
  # Catches macOS-specific regressions (filesystem case-sensitivity,
  # shasum vs. sha256sum, BSD coreutils flag differences) once per
  # merge instead of per PR push.  Failures here block the next
  # main-push run + get fixed in a follow-up PR.
  # ──────────────────────────────────────────────────────────────
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-test-macos-latest

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # ──────────────────────────────────────────────────────────────
  # Compile-only check: catches type errors in code paths that
  # don't have tests (#[cfg(test)] paths only run in `cargo test`).
  # Cheaper than running tests; finishes ~30s typically.
  # ──────────────────────────────────────────────────────────────
  build:
    name: build all targets (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-build

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets --locked

  # ──────────────────────────────────────────────────────────────
  # Informational clippy run. NOT gated (no -D warnings) — exists
  # to surface lint drift in PR logs. Treat clippy output as a
  # discussion prompt, not a blocker. Promote to gated in v0.2
  # once the pedantic backlog is addressed.
  # ──────────────────────────────────────────────────────────────
  clippy:
    name: clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-clippy

      # `|| true` — informational only; never fails the workflow.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked || true

  # ──────────────────────────────────────────────────────────────
  # install.ps1 syntax check on a real Windows runner — Week 13
  # Mon (b), Track A.5.  This catches PowerShell parse errors
  # before they hit a release (since the Linux dev environment
  # can't run pwsh natively without an apt-install).
  #
  # We do NOT run install.ps1 end-to-end — the runner would need
  # WSL2 set up + Internet access to a real release, and that's
  # the cold-VM rehearsal's job (Decision 38).
  #
  # PSScriptAnalyzer is pre-installed on github-hosted windows
  # runners; we use it for style + safety checks in addition to
  # the bare AST parse.
  # ──────────────────────────────────────────────────────────────
  install-ps1-lint:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    # Windows runners count 2× toward the Actions minute budget;
    # the install.ps1 surface changes rarely + regressions can
    # always be caught by re-triggering via workflow_dispatch.
    # Main-push + workflow_dispatch only.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell AST parse
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly."

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Severity 'Error' is gated; warnings + info are
          # informational (printed but don't fail the job) — same
          # posture as the clippy job above.
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity @('Error','Warning','Information')
          $results | Format-Table -AutoSize
          $errors = $results | Where-Object Severity -eq 'Error'
          if ($errors) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s) in install.ps1"
            exit 1
          }

  # ──────────────────────────────────────────────────────────────
  # K8s smoke build — v0.3 Week 18 Thu follow-up.
  #
  # Splits the ~5-min release `aislang` build out of the per-axis
  # k8s-smoke matrix so the binary is built ONCE per main-push and
  # shared via actions/upload-artifact.  Before this split, each
  # axis (kind, k3s) paid the full build cost independently — a
  # wasted ~5 Linux-mins per merge.
  #
  # Posture: build aislang only (not the full workspace); upload
  # the release binary as a single-file artifact.  Cache keyed
  # WITHOUT the cluster axis (single shared cache → 2nd consumer
  # benefits on subsequent merges).  Both matrix axes then
  # `actions/download-artifact` it instead of running cargo.
  # ──────────────────────────────────────────────────────────────
  k8s-smoke-build:
    name: k8s-smoke (build artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Single cache key (no per-axis suffix) — this job is the
          # only writer + both matrix axes downstream just read the
          # artifact, no per-axis cache contention.
          key: ${{ env.CACHE_VERSION }}-k8s-smoke-build

      - name: Build aislang (release profile for the cluster image)
        run: cargo build --release --bin aislang --locked

      - name: Upload aislang release binary
        uses: actions/upload-artifact@v4
        with:
          name: aislang-release-binary
          path: target/release/aislang
          retention-days: 1   # cheap — only consumers are the
                              # matrix jobs that run minutes later
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # K8s smoke — Phase 2 Week 14 Fri (Track B close), Week 15 Wed
  # added the k3s matrix axis.
  #
  # End-to-end gate for the `target = kubernetes` path, run
  # against TWO cluster implementations:
  #
  #   - **kind** (default GitHub-Actions-friendly K8s-in-Docker).
  #     Ships `standard` StorageClass + no default IngressClass.
  #   - **k3s** (via `k3d` — k3s-in-Docker, same posture as kind
  #     but Rancher's lighter-weight K8s distro).  Ships
  #     `local-path` StorageClass + traefik IngressController by
  #     default.
  #
  # Catching kind-only assumptions early — the openwebui PVC's
  # missing `storageClassName` field works on both (cluster
  # picks its own default), but a regression that hardcodes
  # `standard` would silently break k3s.  Same risk for
  # IngressClass + DNS plugin defaults.
  #
  # Pipeline steps (per axis):
  #   0. **`k8s-smoke-build` (prep job)** — builds the aislang
  #      release binary ONCE per main-push + uploads as artifact.
  #      Each axis below downloads instead of rebuilding.
  #   1. Download the aislang binary artifact.
  #   2. Stand up the cluster (kind OR k3s via k3d).
  #   3. Wrap the binary in a local `aislang:ci` Docker image
  #      (the published `ghcr.io/aislang/cli:latest` may not
  #      exist on every commit — pre-release branches especially).
  #   4. Side-load the image (cluster-specific: `kind load
  #      docker-image` vs. `k3d image import`).
  #   5. Create the fake `aislang-providers` Secret so the
  #      preflight check passes (dummy values — no provider
  #      calls happen in smoke).
  #   6. `aislang plan` → `helm upgrade --install` + chart.
  #   7. Wait for every aislang-labelled Deployment to be Ready
  #      (kubectl rollout status, 2-min per-Deployment timeout).
  #   8. `helm lint` the emitted chart.
  #   9. `helm uninstall prod`; assert exit 0 + no aislang
  #      resources remain.
  #  10. Diagnostic dump on failure (cluster-independent).
  #
  # Time budget per axis: 15 min ceiling (was 20 min before the
  # build-share split — the per-axis cargo build was ~5 min of
  # that).  Both axes run in parallel after `k8s-smoke-build`
  # finishes — total wall time ≈ build (5 min) + max(kind, k3s)
  # (~4 min) ≈ 9 min, vs. ~10 min before with both axes
  # rebuilding independently.  Free-tier cost ≈ 1 build × ~5
  # Linux-mins + 2 axes × ~4 Linux-mins ≈ 13 Linux-mins per
  # main-push (was ~20 mins — ~35% savings).
  # ──────────────────────────────────────────────────────────────
  k8s-smoke:
    name: k8s-smoke (${{ matrix.cluster }} + helm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # v0.3 Week 18 Thu follow-up: depends on `k8s-smoke-build`, NOT
    # on `build` directly.  The binary is built once in
    # `k8s-smoke-build` + uploaded as an artifact; each matrix axis
    # downloads it (≤ 30s) instead of re-running cargo (~5 min).
    # Saves ~5 Linux-mins per main-push (the second axis stops
    # re-doing the build).  Both axes still run in parallel post-
    # download so wall-clock = max(kind-test, k3s-test) ≈ ~4 min.
    needs: k8s-smoke-build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    strategy:
      # Both axes run independently — a kind-only regression
      # surfaces on the kind axis without blocking the k3s
      # signal (and vice versa).  Worth keeping BOTH axes
      # despite the cost — they catch DIFFERENT regressions:
      # kind ships debian + `standard` StorageClass; k3s ships
      # alpine + `local-path` SC + traefik.  Past regressions
      # caught here include the openwebui PVC's missing
      # `storageClassName` default + the k3d-vs-k3s version-skew
      # restart loop (Week 16's manual k3d install fix).
      fail-fast: false
      matrix:
        cluster: [kind, k3s]
    steps:
      - uses: actions/checkout@v4

      # No Rust toolchain / cargo build here — the binary is
      # downloaded as an artifact from `k8s-smoke-build`.
      - name: Download aislang release binary
        uses: actions/download-artifact@v4
        with:
          name: aislang-release-binary
          path: target/release/

      - name: Restore executable bit on the downloaded binary
        # actions/upload-artifact serializes through tar but
        # restores POSIX modes on download via v4 — explicit chmod
        # is belt-and-suspenders in case a future v5 changes
        # default behaviour.
        run: chmod +x target/release/aislang

      # ──── Cluster setup (kind OR k3s/k3d, conditional) ────

      - name: Set up kind
        if: matrix.cluster == 'kind'
        uses: helm/kind-action@v1
        with:
          cluster_name: aislang-smoke
          # Pin kind+k8s versions for reproducibility.  kind 0.24
          # ships with K8s 1.31 by default.
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          wait: 90s        # node-Ready timeout

      - name: Set up k3s (via k3d)
        if: matrix.cluster == 'k3s'
        # v0.3 Week 16: replaced `AbsaOSS/k3d-action@v2` with a manual
        # k3d install.  The action hardcodes k3d v5.4.6 (released
        # July 2022, two years before k3s v1.31) — the version skew
        # caused the k3s server to enter a restart loop before the
        # `k3s is up and running` log line, so cluster creation
        # always failed: "node ... is running=true in status=
        # restarting".  k3d v5.7+ supports k3s 1.31; we pin v5.7.5
        # explicitly so a future k3d release can't surprise CI.
        env:
          K3D_VERSION: v5.7.5
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh" \
            | TAG="$K3D_VERSION" bash
          k3d version
          # --agents 0 → single-server cluster (k3d's equivalent
          # of kind's single-node default; matches resource
          # footprint).
          # --no-lb → skip k3d's klipper-LB (we use ClusterIP
          # services + kubectl port-forward for verification;
          # an LB pod would just consume more memory).
          # --image rancher/k3s:v1.31.0-k3s1 → pin K8s 1.31
          # so both axes test the same K8s API surface.
          k3d cluster create aislang-smoke \
            --agents 0 \
            --no-lb \
            --image rancher/k3s:v1.31.0-k3s1 \
            --wait

      - name: Install Helm 3
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      # Build a minimal Docker image around the freshly-built
      # binary — same distroless base as the release.yml image
      # job, but skips the multi-arch buildx + GHCR push (we just
      # need amd64 locally for the cluster to load).
      - name: Build local aislang:ci image
        run: |
          set -euo pipefail
          mkdir -p docker-ci
          cp target/release/aislang docker-ci/aislang
          cat > docker-ci/Dockerfile <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.7
          #
          # v0.3 Week 18 Thu follow-up: base bumped cc-debian12 →
          # cc-debian13 to fix the agent-runtime CrashLoopBackOff
          # the k8s-smoke axes hit on every merge to main.  Root
          # cause: ubuntu-latest = 24.04 (glibc 2.39) builds a
          # binary that requires `GLIBC_2.38` / `GLIBC_2.39`
          # symbols; cc-debian12 ships glibc 2.36 → at pod start
          # `aislang` immediately exits with:
          #   /lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.38'
          #   not found (required by /usr/local/bin/aislang)
          # Container crashes → kubelet restarts → BackOff → helm
          # --wait times out → rollout never reaches 1/1 available.
          # cc-debian13 ships glibc 2.41 which covers both required
          # symbols (and is forward-compat with future ubuntu-26+
          # runners).  Verified locally in kind — pod becomes
          # Ready in <2s after the bump.
          FROM gcr.io/distroless/cc-debian13 AS final
          COPY aislang /usr/local/bin/aislang
          USER nonroot:nonroot
          ENTRYPOINT ["/usr/local/bin/aislang"]
          DOCKERFILE
          docker build -t aislang:ci docker-ci/

      # ──── Image side-load (cluster-specific) ────

      - name: Side-load image into kind
        if: matrix.cluster == 'kind'
        run: kind load docker-image aislang:ci --name aislang-smoke

      - name: Side-load image into k3s (via k3d)
        if: matrix.cluster == 'k3s'
        run: k3d image import aislang:ci --cluster aislang-smoke

      # ──── Cluster-agnostic steps ────

      # The preflight check (Thu) wants the Secret present.  Real
      # keys would never make it into a CI run anyway; dummy
      # values satisfy the existence + non-empty + ASCII probes.
      # The chat-turn round-trip step below short-circuits BEFORE
      # any real provider call, so dummy creds are fine.
      - name: Create fake aislang-providers Secret
        run: |
          kubectl create secret generic aislang-providers \
            --from-literal=ANTHROPIC_API_KEY=dummy-ci-key-ascii-only \
            --from-literal=OPENAI_API_KEY=dummy-ci-key-ascii-only \
            --from-literal=OLLAMA_API_BASE=http://nonexistent:11434

      - name: Apply the demo chart
        env:
          # Override the agent-runtime image to point at the
          # locally-side-loaded `aislang:ci` instead of the
          # default `ghcr.io/aislang/cli:latest` (which may
          # not exist for the current commit).  Done via
          # `helm upgrade --install --set image.…` after the
          # chart is rendered + written; aislang apply doesn't
          # itself take `--set` flags (yet — v0.3 carry-over).
          OUTPUT_DIR: /tmp/aislang-k8s-smoke
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          # First: render manifests + chart to disk via
          # `aislang plan` (apply would also do this but plan
          # gives us inspectability for failures).
          ./target/release/aislang plan examples/support-agent-k8s.ais \
            --output-dir "$OUTPUT_DIR" >/dev/null
          ls -la "$OUTPUT_DIR/manifests" "$OUTPUT_DIR/chart"
          # Helm install with image override so the cluster uses
          # our local aislang:ci.  `aislang apply` would run
          # `helm upgrade --install <release> chart/` without
          # the image override; we replicate that command + add
          # `--set image.{repository,tag}`.
          helm upgrade --install prod "$OUTPUT_DIR/chart" \
            --set image.repository=aislang \
            --set image.tag=ci \
            --wait --timeout 5m

      - name: Lint the emitted chart
        run: helm lint /tmp/aislang-k8s-smoke/chart

      - name: Verify aislang-labelled pods are Ready
        run: |
          kubectl get all -l aislang.generated=true -o wide
          # Each Deployment that aislang emits.  rollout status
          # is bounded by the helm --wait above; this loop just
          # gives a clearer per-Deployment failure than the
          # generic `--wait` timeout.
          for dep in litellm jaeger budget-counter agent-runtime openwebui; do
            kubectl rollout status deploy/$dep --timeout=2m
          done

      - name: Verify openwebui PVC bound (StorageClass parity)
        run: |
          # k3s ships `local-path` as default; kind ships `standard`.
          # Our PVC leaves storageClassName UNSET (defers to cluster
          # default).  Pin that it actually binds on both — catches
          # a regression where the emitter hardcodes the kind name.
          kubectl wait --for=jsonpath='{.status.phase}'=Bound \
            pvc/openwebui-data --timeout=60s
          kubectl get pvc openwebui-data \
            -o jsonpath='{"PVC StorageClass: "}{.spec.storageClassName}{"\n"}'

      - name: Destroy the chart
        run: |
          set -euo pipefail
          # aislang destroy reads the state file written by apply,
          # but our apply path here was helm-direct (above) — so
          # we shell to helm uninstall manually to mirror what
          # aislang destroy would do.  Equivalence is pinned by
          # the cli_apply_destroy_k8s unit tests.
          helm uninstall prod
          # v0.3 Week 18 Thu follow-up: `helm uninstall` returns as
          # soon as the K8s API accepts the DELETE — pods continue
          # to TERMINATE asynchronously (graceful shutdown +
          # terminationGracePeriodSeconds, default 30s).  An
          # immediate `kubectl get all` therefore sees 5 pods in
          # `Status=Terminating` and the assertion fires falsely.
          # Wait up to 90s for full eviction; `kubectl wait
          # --for=delete` returns 0 once every matched resource is
          # actually gone from the apiserver.  Bounded by 90s to
          # avoid hanging CI on a stuck finalizer.
          kubectl wait --for=delete -l aislang.generated=true \
            --timeout=90s pods,services,deployments,replicasets,pvc \
            2>&1 || true
          # Sanity: every aislang-labelled resource should be gone
          # AFTER the wait drains.  --no-headers omits the empty-set
          # warning so `wc -l` reads 0 cleanly when nothing matches.
          remaining=$(kubectl get all -l aislang.generated=true \
            --no-headers 2>/dev/null | wc -l)
          if [ "$remaining" -gt 0 ]; then
            echo "expected 0 aislang resources after destroy; got:"
            kubectl get all -l aislang.generated=true
            exit 1
          fi
          echo "destroy clean — no aislang resources remain."

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          echo "=== cluster ==="
          echo "axis: ${{ matrix.cluster }}"
          kubectl version --output=yaml || true
          echo "=== nodes ==="
          kubectl get nodes -o wide || true
          echo "=== pods ==="
          kubectl get pods -A -o wide || true
          echo "=== PVCs ==="
          kubectl get pvc -A -o wide || true
          echo "=== StorageClasses ==="
          kubectl get storageclass || true
          echo "=== aislang-labelled events ==="
          kubectl get events --sort-by=.lastTimestamp -A | tail -50 || true
          echo "=== describe litellm ==="
          kubectl describe pod -l aislang.component=litellm || true
          echo "=== describe agent-runtime ==="
          kubectl describe pod -l aislang.component=agent_runtime || true
