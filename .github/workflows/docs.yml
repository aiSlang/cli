name: docs

# Build the mdBook under docs-site/ and publish it to GitHub Pages at
# docs.aislang.org.  The built book (docs-site/book/) is gitignored, so
# it's produced fresh here on every push to main that touches the docs.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

# Least-privilege token scopes required by the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment; a newer push cancels an
# in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        env:
          MDBOOK_VERSION: '0.4.40'
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build docs-site

      # Custom domain — GitHub Pages needs a CNAME file at the site root.
      # The book output is gitignored, so write it here after the build.
      - name: Set custom domain
        run: echo 'docs.aislang.org' > docs-site/book/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/book

      - id: deploy
        uses: actions/deploy-pages@v4
